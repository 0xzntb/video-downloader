name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Every checker comes with the dev extra now, so one install is the whole
      # toolchain (E4). What lands here is whatever the ranges in pyproject
      # allow today — which is the point of this matrix: it tests the range.
      - name: Install Viddl and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The suite runs everywhere; it is measured in one place. Nine coverage
      # runs would cost nine times as much and say the same thing, and the
      # floor is a property of the code rather than of the operating system
      # (the platform-specific paths are simulated by the suite either way).
      - name: Run the suite
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: python -m pytest -q

      # 94.0% measured on this cell when the floor was set; 93 leaves room for
      # a patch of new code without room for a hole (E1, E10).
      - name: Run the suite, with a coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pytest -q --cov=viddl --cov-report=term-missing --cov-fail-under=93

      # A static check reads the same source on every runner, so it is answered
      # in one cell rather than nine (E5). ruff is pyflakes' rules plus the ones
      # pyflakes never had; mypy is pointed at `viddl` by pyproject.toml, since
      # that is where the annotations are. `ruff format --check` is deliberately
      # absent: the tree is not formatted by ruff yet, and a first run that
      # rewrites 47 files would hide every real finding in one commit.
      - name: Lint and type-check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m ruff check viddl tests
          python -m mypy

  # The matrix above proves the *declared* range installs and works, wherever
  # pip happens to resolve it today. This job proves the other half (E4): that
  # this tree can be built twice, months apart, with the same versions in it.
  # `--locked` refuses to re-resolve, so a dependency changed without a
  # `uv lock` fails here — in CI, on the pull request — rather than in somebody's
  # install six weeks later.
  locked:
    name: Exactly what uv.lock says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed with pip rather than through an action, so there is no action
      # version in this file that nobody can check from the repository.
      - name: Install uv
        run: python -m pip install uv

      - name: Install exactly the locked versions
        run: uv sync --locked --extra dev

      - name: Run the suite
        run: uv run python -m pytest

      - name: Lint and type-check
        run: |
          uv run python -m ruff check viddl tests
          uv run python -m mypy

  install-windows:
    name: install.ps1 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The real installer, for the current user only: no PATH change and no
      # registry write, so it cannot disturb the runner. Then the launcher it
      # wrote is run exactly as a person would run it.
      - name: Install and run the launcher
        shell: pwsh
        run: |
          $env:VIDDL_HOME = Join-Path $env:RUNNER_TEMP "viddl-home"
          ./install.ps1 -NoPath -NoProtocol
          $launcher = Join-Path $env:VIDDL_HOME "bin\viddl.cmd"
          & $launcher --version
          if ($LASTEXITCODE -ne 0) { throw "viddl --version failed" }
          & $launcher --doctor
          if ($LASTEXITCODE -ne 0) { throw "viddl --doctor failed" }
          & $launcher --plain --help
          if ($LASTEXITCODE -ne 0) { throw "viddl --plain --help failed" }

  # A hook nobody runs is a file. This job is what makes `.githooks/pre-commit`
  # a claim rather than an intention: it switches the hook on exactly as a
  # contributor would, then commits through it four times — one clean change that
  # must land, and three bad ones that must not, each bad for exactly one reason
  # so the step proves the check it names. Windows is left out because the hook
  # has only been exercised where `sh` is the shell executing it; Git Bash can
  # run it by hand (`sh .githooks/pre-commit`), and the interpreter lookup
  # already covers `.venv\Scripts\python.exe`.
  hook:
    name: The pre-commit hook (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No venv here on purpose: the hook looks for one first and then falls back
      # to PATH, and PATH is the case a contributor without a venv hits.
      - name: Install Viddl and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Switch the hook on
        run: git config core.hooksPath .githooks

      - name: A clean file is committed
        shell: bash
        run: |
          git config user.email "hook@viddl.invalid"
          git config user.name "hook test"
          printf 'VALUE = 1\n' > probe_ok.py
          git add probe_ok.py
          git commit -m "probe: a clean file"

      - name: Trailing whitespace is refused
        shell: bash
        run: |
          printf 'VALUE = 2  \n' > probe_ok.py
          git add probe_ok.py
          if git commit -m "probe: trailing whitespace"; then
            echo "::error::the hook committed a trailing space"
            exit 1
          fi

      - name: A lint finding is refused
        shell: bash
        run: |
          printf 'import os\n\nVALUE = 3\n' > probe_ok.py
          git add probe_ok.py
          if git commit -m "probe: unused import"; then
            echo "::error::the hook committed an unused import"
            exit 1
          fi

      # The smoke slice is six files, not the suite, so the failure is planted in
      # one of them — and it is written to pass ruff, so pytest is the only thing
      # that can refuse this commit.
      - name: A failing smoke test is refused
        shell: bash
        run: |
          printf '\n\ndef test_probe_fails():\n    value = 1\n    assert value == 2\n' >> tests/test_util.py
          git add tests/test_util.py
          if git commit -m "probe: failing smoke test"; then
            echo "::error::the hook committed a failing smoke test"
            exit 1
          fi
