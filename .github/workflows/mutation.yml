name: mutation

# Mutation testing (E11) answers a different question from the suite: not "did
# this line run" but "would anything have noticed if it hadn't". `mutmut` flips a
# statement, runs the tests, and counts the flips nobody caught.
#
# It is the one check here that is too slow for a pull request — every mutant
# costs a test run, and the scope exists precisely to keep that affordable — so
# it runs weekly and on demand. The gate is a score rather than zero survivors,
# because a handful of mutants are equal in behaviour to the original and no
# test could tell them apart; `tools/mutation_score.py` prints every survivor so
# that "equal in behaviour" stays a claim somebody checked.

on:
  schedule:
    # Mondays, 05:41 UTC — an hour after the engine job, so the two long jobs do
    # not start in the same minute.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutants that survive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Viddl and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Four children rather than eight: a runner has two cores, and the point is
      # a number that means something rather than the fastest possible number.
      # The scope and the tests it runs are in `[tool.mutmut]` in pyproject.toml.
      - name: Flip the code and see what notices
        run: python -m mutmut run --max-children 4

      - name: The score, and every mutant that got through
        run: python tools/mutation_score.py
