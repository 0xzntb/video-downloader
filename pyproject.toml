[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viddl"
version = "1.0.0"
description = "A friendly terminal app that downloads videos and MP3s by pasting a link."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The app's themes (U1) need Textual 0.86, but the screen already needed more:
# its stylesheet uses text-wrap/text-overflow, which 1.0 refuses, and 2.0's
# test pilot is still loose enough to fail four of our tests. 3.0 is the oldest
# release the whole suite passes on (1148 tests, measured); 8.2.8 is the one it
# is developed against.
#
# The upper bound is the point of it (E4): 9.0 may change the screen, the pilot
# or the stylesheet, and a fresh install must not be the first place anyone finds
# out. Widening it means running the suite on the new major and saying so here —
# the range is measured, not wished for. `uv.lock` holds the exact version the
# suite is run against.
dependencies = ["textual>=3.0,<9"]

[project.optional-dependencies]
# pytest-cov is here rather than in CI's own install line so that the coverage
# floor can be reproduced exactly: `pip install -e ".[dev]"` and
# `pytest --cov=viddl --cov-fail-under=94` is what the workflow runs (E1, E10).
# Upper bounds for the same reason as textual's (E4), and every checker is here
# so that one install is the whole toolchain.
dev = [
    "pytest>=7,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    # ruff carries pyflakes' rules (F) and the style rules pyflakes never had,
    # and it is fast enough to run on every change — pyflakes itself is gone,
    # because a second checker whose rules are a subset of the first only adds
    # a way for the two to disagree (E5). mypy checks the annotations the
    # codebase already carries; they were written and then left unverified.
    "ruff>=0.9,<1",
    "mypy>=1.11,<2",
    # The parsers take untrusted input — a ``viddl://`` URL from any web page,
    # whatever a site said its file weighs, whatever the engine wrote on stderr
    # — and hand-written examples only ever cover the shapes someone thought
    # of. hypothesis generates the rest (E9). Bounded the same way as the
    # others, and pinned exactly in `uv.lock`.
    "hypothesis>=6.98,<7",
    # Mutation testing (E11) flips the code and checks the suite notices, which
    # is the only thing that can tell a real assertion from one that happens to
    # pass. It is slow, so it only runs in the weekly job.
    # mutmut 3 needs 3.10; the app itself still runs on 3.9, and the weekly
    # job that uses it runs on 3.12, so the marker keeps both true (E4).
    "mutmut>=3.8,<4; python_version >= '3.10'",
]

[project.scripts]
viddl = "viddl.cli:main"

[tool.setuptools.packages.find]
include = ["viddl*"]

[tool.setuptools.package-data]
viddl = [
    "browser_extension/*.json",
    "browser_extension/*.js",
    "browser_extension/*.html",
    "browser_extension/*.css",
    "browser_extension/icons/*.png",
    "web_ui/*.html",
    "web_ui/*.js",
    "web_ui/*.css",
]

[tool.ruff]
# The code the project claims to support, so a fix ruff offers is one that still
# runs on 3.9.
target-version = "py39"

[tool.ruff.lint]
# pyflakes' checks (F) plus what pyflakes never looked for: pyupgrade (UP),
# bugbear (B), import order (I), the small simplifications (SIM) and ruff's own
# (RUF). The rest of ruff is not selected on purpose — this is a program with a
# screen and a subprocess, not a web service, and a rule set nobody reads is a
# rule set everybody suppresses (E5).
select = ["E4", "E7", "E9", "F", "B", "I", "SIM", "UP", "RUF"]
ignore = [
    # ``Optional[X]`` and ``List[X]`` stay: the project supports 3.9, and a
    # reader there should not have to translate a spelling their Python cannot
    # use. UP035 follows from the same choice, so all three go together.
    "UP006",
    "UP035",
    "UP045",
    # The prose is full of deliberate typography — em dashes, “curly quotes”, an
    # arrow in a hint — and RUF001/2/3 call those ambiguous because they resemble
    # ASCII. They are not ambiguous in a sentence nobody types at a prompt.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
# The package, not the tests: the annotations are here, and a wrong one costs
# somebody a download. The tests are checked by being run, which says more about
# them than a type ever could (E5).
files = ["viddl"]
python_version = "3.9"
# On top of the defaults: a function with no annotations still has its body
# checked, `Optional[X]` cannot quietly become `X`, and an ignore that is no
# longer needed fails rather than sitting there unexplained.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
#: ``integration`` tests drive the real yt-dlp against a file served on
#: 127.0.0.1 (tests/test_integration.py). They skip — never pass — when no
#: yt-dlp is installed, which is every runner but the weekly engine job.
markers = [
    "integration: needs a real yt-dlp, skipped when there is none",
]

[tool.coverage.run]
source = ["viddl"]

[tool.coverage.report]
# The floor lives in the workflow, next to the command that enforces it; this
# only decides what the report looks at.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mutmut]
# Mutation testing (E11) is deliberately narrow. Flipping a statement in the
# screen's layout would report a gap nobody cares about, and every mutant costs a
# pytest run; these two files are where a flipped statement is a *safety*
# decision — the link check, the redaction, the formatting — and their tests are
# fast enough to make the run worth having.
source_paths = ["viddl/util.py", "viddl/errors.py"]
# mutmut copies only the files it mutates; the rest of the package has to
# come along or `viddl/__init__.py` is missing and every import fails.
also_copy = ["viddl/"]
pytest_add_cli_args_test_selection = [
    "tests/test_util.py",
    "tests/test_errors.py",
    "tests/test_logfile.py",
    "tests/test_title.py",
    "tests/test_search.py",
    "tests/test_properties.py",
]
